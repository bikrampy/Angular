<div class="min-h-[calc(100vh-120px)] flex flex-col items-center px-6 py-8 space-y-8">

  <!-- Navigation -->
  <nav class="flex gap-6 bg-white shadow-sm rounded-xl px-6 py-3">
    <a
      routerLink="/"
      class="text-slate-700 font-medium hover:text-blue-600 transition"
    >
      Home
    </a>

    <a
      [routerLink]="['/users']"
      class="text-slate-700 font-medium hover:text-blue-600 transition"
    >
      Users
    </a>
  </nav>

  <!-- Users Card -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 space-y-4">

    <h1 class="text-2xl font-bold text-slate-800 text-center">
      Users List
    </h1>

    <ul class="space-y-3">
      @for (user of users(); track user.id) {
        <li>
          <a
            [routerLink]="['/profile', user.id]"
            class="block px-4 py-2 rounded-lg border border-slate-200
                   text-slate-700 hover:bg-slate-100 hover:text-blue-600
                   transition"
          >
            {{ user.name }}
          </a>
        </li>
      }
    </ul>

  </div>

</div>
