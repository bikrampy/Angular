<div>
  <select name="" id="" (change)="handleSelect($event)">
    <option value="pending">Pending</option>
    <option value="shipped">Shipped</option>
    <option value="outForDelivery">Out For Delivery</option>
    <option value="delivered">Delivered</option>
  </select>
  @switch (status()) {
    @case ('pending') {
      <p class="text-2xl text-orange-300">Pending</p>
    }
    @case ('shipped') {
      <p class="text-2xl text-green-500">Order Shipped</p>
    }
    @case ('outForDelivery') {
      <p class="text-2xl text-red-500">Order is Out For Delivery</p>
    }
    @case ('delivered') {
      <p class="text-2xl text-red-500">Order is Delivered</p>
    }
  }
</div>
