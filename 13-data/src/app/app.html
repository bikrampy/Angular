
<div class="min-h-screen bg-slate-100 flex items-center justify-center p-6">
  <div class="w-full max-w-2xl bg-white rounded-2xl shadow-lg p-8 space-y-6">

    <!-- Header -->
    <h1 class="text-3xl font-bold text-slate-800 text-center">
      User Management
    </h1>

    <!-- Input & Button -->
    <div class="flex flex-col sm:flex-row gap-4">
      <input
        type="text"
        placeholder="Enter username"
        class="flex-1 rounded-lg border border-slate-300 px-4 py-2 focus:ring-2 focus:ring-amber-500 focus:outline-none transition"
        [value]="user()"
        (change)="user.set($event.target.value)"
      >
      <button
        (click)="addUser()"
        class="bg-amber-500 text-white px-6 py-2 rounded-lg font-medium hover:bg-amber-600 transition"
      >
        Add New User
      </button>
    </div>

    <!-- User List -->
    <div class="space-y-4">
      @for (user of users(); track $index) {
        <app-user [username]="user"></app-user>
      }
    </div>

  </div>
</div>
