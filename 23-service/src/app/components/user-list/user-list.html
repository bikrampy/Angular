<div class="min-h-screen bg-slate-950 p-6 text-slate-100">
  <h1 class="mb-6 text-3xl font-bold tracking-wide">
    Users List
  </h1>

  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    @for (user of usersData(); track user.id) {
      <a
        [routerLink]="['/details', user.id]"
        class="group rounded-xl border border-slate-800 bg-slate-900 p-5 transition
               hover:border-indigo-500 hover:bg-slate-800 hover:shadow-lg"
      >
        <div class="flex items-center gap-4">
          <img
            [src]="user.image"
            [alt]="user.firstName"
            class="h-14 w-14 rounded-full border border-slate-700"
          />

          <div>
            <h2 class="text-lg font-semibold group-hover:text-indigo-400">
              {{ user.firstName }} {{ user.lastName }}
            </h2>

            <p class="text-sm text-slate-400">
              {{ user.email }}
            </p>
          </div>
        </div>

        <div class="mt-4 flex justify-between text-sm text-slate-400">
          <span class="capitalize">{{ user.role }}</span>
          <span>{{ user.company.title }}</span>
        </div>
      </a>
    }
  </div>
</div>
