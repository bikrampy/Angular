<div
  class="min-h-dvh p-4"
  [ngClass]="{
    'bg-black text-white': isDarkMode(),
    '': !isDarkMode()
  }"
>
  @if (isDarkMode()) {
  <p [ngClass]="pClasses">Hello ngClass in Dark Mode</p>
  } @else {
  <p [ngClass]="pClasses">Hello ngClass in Light Mode</p>
  }
  <button
    class="px-4 py-2 rounded-2xl"
    [ngClass]="{
      'bg-white text-black': isDarkMode(),
      'bg-black text-white': !isDarkMode()
    }"
    (click)="isDarkMode.set(!isDarkMode())"
  >
    Toggle
  </button>
</div>
