<header class="bg-white shadow-md">
  <div class="max-w-6xl mx-auto px-6 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <a routerLink="/">
      <h1 class="text-2xl font-bold text-slate-800">
        My Angular App
      </h1>
    </a>
    <nav>
      <ul class="flex flex-col sm:flex-row gap-3 sm:gap-6 text-slate-600 font-medium">
        <li>
          <a
            routerLink="/"
            class="block px-3 py-2 rounded-lg hover:bg-slate-100 hover:text-blue-600 transition"
            routerLinkActive="text-blue-600 bg-slate-100"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Home
          </a>
        </li>
        <li>
          <a
            routerLink="/about"
            class="block px-3 py-2 rounded-lg hover:bg-slate-100 hover:text-blue-600 transition"
            routerLinkActive="text-blue-600 bg-slate-100"
          >
            About
          </a>
        </li>
        <li>
          <a
            routerLink="/contact"
            class="block px-3 py-2 rounded-lg hover:bg-slate-100 hover:text-blue-600 transition"
            routerLinkActive="text-blue-600 bg-slate-100"
          >
            Contact
          </a>
        </li>
        <li>
          <a
            routerLink="/profile"
            class="block px-3 py-2 rounded-lg hover:bg-slate-100 hover:text-blue-600 transition"
            routerLinkActive="text-blue-600 bg-slate-100"
          >
            Profile
          </a>
        </li>
      </ul>
    </nav>

  </div>
</header>
