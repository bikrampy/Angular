
<div class="min-h-[calc(100vh-160px)] flex items-center justify-center px-6">
  <div class="max-w-3xl text-center space-y-6">

    <h1 class="text-6xl font-extrabold text-slate-800">
      404
    </h1>

    <h2 class="text-2xl font-semibold text-slate-700">
      Page Not Found
    </h2>

    <p class="text-slate-500">
      Sorry, the page you are looking for doesn’t exist or has been moved.
    </p>

    <div class="mt-6 flex justify-center gap-4">
      <button
        (click)="redirectTo('')"
        class="px-6 py-3 rounded-lg bg-blue-600 text-white font-medium
               hover:bg-blue-700 transition"
      >
        Go Home
      </button>

      <button
        (click)="redirectTo('about')"
        class="px-6 py-3 rounded-lg border border-slate-300 text-slate-700 font-medium
               hover:bg-slate-100 transition"
      >
        Learn More
      </button>
    </div>

  </div>
</div>
